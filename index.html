<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushi Gupta</title>

    <!-- Google Fonts: a clean, readable pairing -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ── CSS Variables: change these to retheme the whole page ── */
        :root {
            --bg:       #f9f7f4;
            --text:     #1a1a1a;
            --muted:    #888;
            --accent:   #2a6ef5;
            --border:   #e4e0d8;
            --max-w:    640px;
        }

        /* ── Reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            line-height: 1.7;
            padding: 60px 24px;
        }

        /* ── Layout: everything lives in one centered column ── */
        .container {
            max-width: var(--max-w);
            margin: 0 auto;
        }

        /* ── Header ── */
        header {
            margin-bottom: 48px;
        }

        header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        /* ── Section ── */
        section {
            margin-bottom: 40px;
        }

        section h2 {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 16px;
        }

        /* ── Links list ── */
        ul.link-list {
            list-style: none;
        }

        ul.link-list li {
            border-top: 1px solid var(--border);
            padding: 12px 0;
        }

        ul.link-list li:last-child {
            border-bottom: 1px solid var(--border);
        }

        ul.link-list a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95rem;
        }

        ul.link-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <header>
            <h1>Khushi Gupta</h1>
            <p>Developer &amp; lifelong learner.</p>
        </header>

        <!-- ABOUT -->
        <section>
            <h2>About</h2>
            <p>Hi! I'm Khushi — write a sentence or two about yourself here.
               What are you learning? What are you building toward?</p>
        </section>

        <!-- LINKS -->
        <section>
            <h2>Links</h2>
            <ul class="link-list">
                <li><a href="https://github.com/your-username">GitHub →</a></li>
                <li><a href="#">Another link →</a></li>
            </ul>
        </section>

    </div>
</body>
</html>
